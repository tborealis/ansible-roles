---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert Docker is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['docker.service'].state == 'running'
          - ansible_facts.services['docker.service'].status == 'enabled'

    - name: Read apt repository source
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/docker.sources
      register: docker_verify_source

    - name: Assert repository points at Docker and is pinned to the managed keyring
      vars:
        docker_verify_source_content: "{{ docker_verify_source.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'URIs: https://download.docker.com/linux/debian' in docker_verify_source_content"
          - "'Signed-By: /etc/apt/keyrings/docker.gpg' in docker_verify_source_content"

    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Assert the installed packages are on the pinned major releases
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['docker-ce'][0].version is match('5:29\.')
          - ansible_facts.packages['containerd.io'][0].version is match('2\.')
          - ansible_facts.packages['docker-compose-plugin'][0].version is match('5\.')

    # Docker's test channel carries its release candidates
    - name: Add Docker's pre-release channel
      ansible.builtin.deb822_repository:
        name: docker-test
        types: [deb]
        uris: https://download.docker.com/linux/debian
        suites: trixie
        components: test
        signed_by: /etc/apt/keyrings/docker.gpg

    - name: Update apt cache with the pre-release channel
      ansible.builtin.apt:
        update_cache: true

    - name: Read docker-ce's apt policy # noqa: command-instead-of-module (no module reports pin priorities)
      ansible.builtin.command: apt-cache policy docker-ce
      register: docker_verify_policy
      changed_when: false

    - name: Remove the pre-release channel
      ansible.builtin.deb822_repository:
        name: docker-test
        state: absent

    - name: Update apt cache without the pre-release channel
      ansible.builtin.apt:
        update_cache: true

    - name: Assert pre-releases are pinned out and the candidate stays on the pinned major
      vars:
        docker_verify_prereleases: >-
          {{ docker_verify_policy.stdout_lines | select('search', '~(alpha|beta|rc)') | list }}
      ansible.builtin.assert:
        that:
          - docker_verify_prereleases | length > 0
          - docker_verify_prereleases | reject('search', ' -1$') | list | length == 0
          - >-
            docker_verify_policy.stdout is search('Candidate: 5:29\.')

    - name: Read daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_verify_daemon_json

    - name: Assert daemon.json merges converge's settings over the role's
      vars:
        docker_verify_daemon: "{{ docker_verify_daemon_json.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - docker_verify_daemon['log-driver'] == 'local'
          - docker_verify_daemon['no-new-privileges'] is true
          - docker_verify_daemon['icc'] is false
          - docker_verify_daemon['userland-proxy'] is false
          - docker_verify_daemon['ip'] == '127.0.0.1'
          - >-
            docker_verify_daemon['default-network-opts']['bridge']['com.docker.network.bridge.host_binding_ipv4']
            == '127.0.0.1'
          - docker_verify_daemon['log-opts']['max-size'] == '5m'
          - "'apparmor' in ansible_facts.packages"

    - name: Query the running daemon # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker info --format json
      register: docker_verify_info
      changed_when: false

    - name: Assert the daemon loaded the config
      ansible.builtin.assert:
        that:
          - (docker_verify_info.stdout | from_json).LoggingDriver == 'local'

    - name: Inspect the default bridge # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker network inspect bridge --format json
      register: docker_verify_bridge
      changed_when: false

    - name: Assert the default bridge has inter-container traffic off and binds to loopback
      vars:
        docker_verify_bridge_options: "{{ (docker_verify_bridge.stdout | from_json | first).Options }}"
      ansible.builtin.assert:
        that:
          - docker_verify_bridge_options['com.docker.network.bridge.enable_icc'] == 'false'
          - docker_verify_bridge_options['com.docker.network.bridge.host_binding_ipv4'] == '127.0.0.1'

    - name: Run a container that reports its no_new_privs flag # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker run --rm busybox:1.37 grep NoNewPrivs /proc/self/status
      register: docker_verify_nnp
      changed_when: false

    - name: Assert containers get no-new-privileges by default
      ansible.builtin.assert:
        that:
          - docker_verify_nnp.stdout is search('NoNewPrivs:\s+1')

    - name: Read the unattended-upgrades opt-in
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/53unattended-upgrades-docker
      register: docker_verify_unattended

    - name: Assert unattended-upgrades allows the Docker repository
      ansible.builtin.assert:
        that:
          - "'\"origin=Docker,archive=${distro_codename}\";' in docker_verify_unattended.content | b64decode"

    - name: Query the Buildx plugin # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker buildx version
      changed_when: false

    - name: Create the Compose project directory
      ansible.builtin.file:
        path: /srv/docker-verify
        state: directory
        mode: "0755"

    - name: Write a Compose project
      ansible.builtin.copy:
        dest: /srv/docker-verify/compose.yaml
        mode: "0644"
        content: |
          services:
            web:
              image: busybox:1.37
              command: httpd -f -p 80
              restart: unless-stopped
              ports:
                - "8081:80"
            public:
              image: busybox:1.37
              command: httpd -f -p 80
              restart: unless-stopped
              ports:
                - "0.0.0.0:8082:80"
            unlisted:
              image: busybox:1.37
              command: httpd -f -p 80
              restart: unless-stopped
              ports:
                - "0.0.0.0:8083:80"
            setuid:
              image: busybox:1.37
              command: sh -c 'grep NoNewPrivs /proc/self/status; exec sleep infinity'
              restart: unless-stopped
              security_opt:
                - no-new-privileges=false

    - name: Start the Compose project # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker compose --project-directory /srv/docker-verify up --detach --wait
      changed_when: false

    - name: List the Compose project's containers # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker compose --project-directory /srv/docker-verify ps --format json
      register: docker_verify_compose_ps
      changed_when: false

    - name: Assert Compose started the services
      ansible.builtin.assert:
        that:
          - docker_verify_compose_ps.stdout_lines | map('from_json') | map(attribute='State') | unique == ['running']
          - docker_verify_compose_ps.stdout_lines | length == 4

    - name: Query the host address of the web service's published port # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker compose --project-directory /srv/docker-verify port web 80
      register: docker_verify_compose_port
      changed_when: false

    - name: Fetch the web service through its published port
      ansible.builtin.uri:
        url: http://127.0.0.1:8081/
        status_code: [200, 404]

    - name: List docker-proxy processes # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: pgrep -c docker-proxy
      register: docker_verify_proxies
      changed_when: false
      failed_when: docker_verify_proxies.rc not in [0, 1]

    - name: Read the setuid service's output # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker compose --project-directory /srv/docker-verify logs --no-log-prefix setuid
      register: docker_verify_setuid_logs
      changed_when: false

    - name: Assert ports bind to loopback without a proxy, and a service can opt out of no-new-privileges
      ansible.builtin.assert:
        that:
          - docker_verify_compose_port.stdout == '127.0.0.1:8081'
          - docker_verify_proxies.stdout == '0'
          - docker_verify_setuid_logs.stdout is search('NoNewPrivs:\s+0')

    # From the controller, so connections arrive on the instance's public
    # interface as they would from the internet
    - name: Probe the published ports from outside the host
      ansible.builtin.include_tasks: tasks/probe-public-ports.yml

    - name: Read the public-interface firewall rules # noqa: command-instead-of-module (no module lists a chain)
      ansible.builtin.command: "{{ item }} -w -S PUBLIC-CONTAINERS"
      loop: [iptables, ip6tables]
      register: docker_verify_firewall_rules
      changed_when: false

    - name: Assert both address families filter the public interface
      ansible.builtin.assert:
        that:
          - item.stdout is search('-A PUBLIC-CONTAINERS ! -i ' ~ ansible_facts['default_ipv4']['interface'] ~ ' -j RETURN')
          - item.stdout is search('--ctorigdstport 8082 -j RETURN')
          - item.stdout is search('-A PUBLIC-CONTAINERS -j DROP')
      loop: "{{ docker_verify_firewall_rules.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

    - name: Wait for the Compose project to come back # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker compose --project-directory /srv/docker-verify up --detach --wait
      changed_when: false

    - name: Probe the published ports again after Docker restarted
      ansible.builtin.include_tasks: tasks/probe-public-ports.yml

    - name: Query the prune timer # noqa: command-instead-of-module (service_facts omits timers)
      ansible.builtin.command: systemctl is-enabled docker-prune.timer
      register: docker_verify_prune_timer
      changed_when: false

    - name: Assert the prune timer is enabled
      ansible.builtin.assert:
        that:
          - docker_verify_prune_timer.stdout == 'enabled'

    - name: Pull an image no container uses # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker pull --quiet busybox:1.36
      changed_when: false

    - name: Run the prune service
      ansible.builtin.systemd_service:
        name: docker-prune.service
        state: started

    - name: List images after the prune # noqa: command-instead-of-module (exercising the binary)
      ansible.builtin.command: docker image ls --format json
      register: docker_verify_images
      changed_when: false

    - name: Assert the prune removed the unused image and kept the one in use
      vars:
        docker_verify_image_tags: >-
          {{ docker_verify_images.stdout_lines | map('from_json')
             | map(attribute='Tag') | list }}
      ansible.builtin.assert:
        that:
          - "'1.36' not in docker_verify_image_tags"
          - "'1.37' in docker_verify_image_tags"

    - name: Apply the role with a setting dockerd rejects
      block:
        - name: Apply the role with an unknown daemon.json key
          ansible.builtin.include_role:
            name: tborealis.roles.docker
          vars:
            docker_daemon_config:
              not-a-docker-option: true
      rescue:
        - name: Record that the role refused the config
          ansible.builtin.set_fact:
            docker_verify_rejected: true

    - name: Read daemon.json after the rejected config
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_verify_daemon_json_after

    - name: Gather service facts after the rejected config
      ansible.builtin.service_facts:

    - name: Assert the rejected config was not written and Docker kept running
      ansible.builtin.assert:
        that:
          - docker_verify_rejected | default(false)
          - "'not-a-docker-option' not in docker_verify_daemon_json_after.content | b64decode"
          - ansible_facts.services['docker.service'].state == 'running'

    - name: Apply the role with the firewall turned off
      ansible.builtin.include_role:
        name: tborealis.roles.docker
      vars:
        docker_firewall: false

    - name: Check for the firewall unit after turning it off
      ansible.builtin.stat:
        path: /etc/systemd/system/docker-firewall.service
      register: docker_verify_firewall_unit

    - name: Look for the firewall chain after turning it off # noqa: command-instead-of-module (no module lists a chain)
      ansible.builtin.command: iptables -w -S PUBLIC-CONTAINERS
      register: docker_verify_firewall_chain
      changed_when: false
      failed_when: false

    - name: Fetch the unlisted public port from outside the host without the firewall
      ansible.builtin.uri:
        url: "http://{{ ansible_facts['default_ipv4']['address'] }}:8083/"
        status_code: [200, 404]
        timeout: 5
      delegate_to: localhost
      become: false

    - name: Assert turning the firewall off removed its unit and rules
      ansible.builtin.assert:
        that:
          - not docker_verify_firewall_unit.stat.exists
          - docker_verify_firewall_chain.rc != 0
