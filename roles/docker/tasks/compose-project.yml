---
- name: Check for a deployed image of Compose project {{ docker_compose_project.name }}
  ansible.builtin.stat:
    path: "{{ docker_compose_project_dir }}/deploy.env"
  register: docker_compose_deployed

- name: Create the directories of Compose project {{ docker_compose_project.name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ docker_compose_project_dir }}"
    - "{{ docker_compose_project_dir }}/secrets"
  when: docker_compose_project.state == 'present'

- name: Write the compose file of Compose project {{ docker_compose_project.name }}
  ansible.builtin.template:
    src: "{{ docker_compose_project.template }}"
    dest: "{{ docker_compose_project_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"
  register: docker_compose_template
  when:
    - docker_compose_project.state == 'present'
    - docker_compose_project.template is defined

- name: Write the compose file from the definition of Compose project {{ docker_compose_project.name }}
  ansible.builtin.copy:
    content: "{{ docker_compose_project.definition | to_nice_yaml(indent=2) }}"
    dest: "{{ docker_compose_project_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"
  register: docker_compose_definition
  when:
    - docker_compose_project.state == 'present'
    - docker_compose_project.definition is defined

- name: Write the environment file of Compose project {{ docker_compose_project.name }}
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ docker_compose_project_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  register: docker_compose_env
  when: docker_compose_project.state == 'present'

- name: Write the secrets of Compose project {{ docker_compose_project.name }}
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ docker_compose_project_dir }}/secrets/{{ item.name }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0400') }}"
  loop: "{{ docker_compose_project.secrets | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: docker_compose_secrets
  no_log: true
  when: docker_compose_project.state == 'present'

- name: Find the secret files of Compose project {{ docker_compose_project.name }}
  ansible.builtin.find:
    paths: "{{ docker_compose_project_dir }}/secrets"
    hidden: true
  register: docker_compose_secret_files
  when: docker_compose_project.state == 'present'

- name: Remove secrets no longer listed for Compose project {{ docker_compose_project.name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ docker_compose_secret_files.files | default([]) | map(attribute='path')
       | reject('in', docker_compose_project.secrets | default([]) | map(attribute='name')
                | map('regex_replace', '^', docker_compose_project_dir ~ '/secrets/') | list)
       | list }}
  when: docker_compose_project.state == 'present'

# A CI-deployed project starts with its first deploy. A container keeps the
# secret file it mounted, so new secret content needs a recreate.
- name: Start Compose project {{ docker_compose_project.name }}
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_project_dir }}"
    project_name: "{{ docker_compose_project.name }}"
    env_files: "{{ ['.env'] + (['deploy.env'] if docker_compose_project.deploy is defined else []) }}"
    state: present
    pull: policy
    remove_orphans: true
    recreate: "{{ 'always' if docker_compose_secrets is changed else 'auto' }}"
    wait: true
    wait_timeout: "{{ docker_compose_project.wait_timeout | default(600) }}"
  register: docker_compose_up
  when:
    - docker_compose_project.state == 'present'
    - docker_compose_project.deploy is not defined or docker_compose_deployed.stat.exists

- name: Check for the compose file of Compose project {{ docker_compose_project.name }}
  ansible.builtin.stat:
    path: "{{ docker_compose_project_dir }}/compose.yaml"
  register: docker_compose_file
  when: docker_compose_project.state == 'absent'

- name: Stop and remove Compose project {{ docker_compose_project.name }}
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_project_dir }}"
    project_name: "{{ docker_compose_project.name }}"
    env_files: "{{ ['.env'] + (['deploy.env'] if docker_compose_deployed.stat.exists else []) }}"
    state: absent
    remove_orphans: true
  register: docker_compose_down
  when:
    - docker_compose_project.state == 'absent'
    - docker_compose_file.stat.exists

# Recorded like a deploy, e.g. `provisioned recreated=<container> changed=secrets`
- name: Record the container changes in the history of Compose project {{ docker_compose_project.name }}
  vars:
    docker_compose_result: "{{ docker_compose_up if docker_compose_project.state == 'present' else docker_compose_down }}"
    docker_compose_containers: >-
      {{ docker_compose_result.actions | default([]) | selectattr('what', 'eq', 'container') | list }}
    docker_compose_created: >-
      {{ docker_compose_containers | selectattr('status', 'in', ['Creating', 'Recreate'])
         | map(attribute='id') | list }}
    docker_compose_changes:
      created: "{{ docker_compose_containers | selectattr('status', 'eq', 'Creating') | map(attribute='id') | unique | join(',') }}"
      recreated: "{{ docker_compose_containers | selectattr('status', 'eq', 'Recreate') | map(attribute='id') | unique | join(',') }}"
      started: >-
        {{ docker_compose_containers | selectattr('status', 'eq', 'Starting') | map(attribute='id')
           | reject('in', docker_compose_created) | unique | join(',') }}
      removed: "{{ docker_compose_containers | selectattr('status', 'eq', 'Removing') | map(attribute='id') | unique | join(',') }}"
      changed: >-
        {{ {'compose.yaml': docker_compose_template is changed or docker_compose_definition is changed,
            '.env': docker_compose_env is changed, 'secrets': docker_compose_secrets is changed}
           | dict2items | selectattr('value') | map(attribute='key') | join(',') }}
    docker_compose_fields: "{{ docker_compose_changes | dict2items | selectattr('value') }}"
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/sbin/docker-compose-log', docker_compose_project.name, 'provisioned']
         + (docker_compose_fields | map(attribute='key') | zip(docker_compose_fields | map(attribute='value'))
            | map('join', '=') | list) }}
  changed_when: true
  when: docker_compose_containers | length > 0

- name: Remove the directory of Compose project {{ docker_compose_project.name }}
  ansible.builtin.file:
    path: "{{ docker_compose_project_dir }}"
    state: absent
  when: docker_compose_project.state == 'absent'
