---
- name: Assert the host runs Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_release'] == 'trixie'
    fail_msg: The docker role supports Debian 13 (trixie) only.

- name: Install deb822 dependency
  ansible.builtin.apt:
    pkg: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.gpg
  register: docker_repo

- name: Update apt cache after adding repository # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo is changed

- name: Pin Docker to major release {{ docker_version }}
  ansible.builtin.template:
    src: apt-preferences.j2
    dest: /etc/apt/preferences.d/docker
    owner: root
    group: root
    mode: "0644"
  register: docker_pin

- name: Install Docker
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      # Only recommended by docker-ce, but without apparmor_parser containers
      # silently run without the docker-default profile
      - apparmor
    # A changed pin, such as a raised docker_version, upgrades in this run
    # rather than at the next unattended one
    state: "{{ 'latest' if docker_pin is changed else 'present' }}"
    update_cache: true
    cache_valid_time: 3600

- name: Create the Docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the Docker daemon
  vars:
    docker_daemon_base_config:
      log-driver: local
      no-new-privileges: "{{ docker_no_new_privileges }}"
      icc: false
      # Published ports are reached through NAT, never a docker-proxy process,
      # so the DOCKER-USER chain sees every connection to them.
      userland-proxy: false
      ip: "{{ docker_default_bind_address }}"
      default-network-opts:
        bridge:
          com.docker.network.bridge.host_binding_ipv4: "{{ docker_default_bind_address }}"
  ansible.builtin.copy:
    content: |
      {{ docker_daemon_base_config | combine(docker_daemon_config) | to_nice_json }}
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    # A config dockerd rejects would stop Docker, and every container, on restart
    validate: dockerd --validate --config-file %s
  notify: Restart docker

- name: Configure unattended Docker updates
  ansible.builtin.import_tasks: unattended-upgrades.yml

- name: Filter connections from the public interface to published ports
  ansible.builtin.import_tasks: firewall.yml

- name: Prune unused images weekly
  ansible.builtin.import_tasks: prune.yml

- name: Ensure Docker is started and enabled
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Log in to registries
  ansible.builtin.import_tasks: registries.yml

# Tasks that use Docker next (e.g. Compose deploys) need the new config now
- name: Apply daemon config changes
  ansible.builtin.meta: flush_handlers
