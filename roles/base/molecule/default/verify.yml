---
- name: Verify
  hosts: all
  become: true
  vars_files:
    - vars.yml
  tasks:
    - name: Check the runtime hostname # noqa: command-instead-of-module
      ansible.builtin.command: hostname
      register: base_verify_hostname
      changed_when: false

    - name: Assert the hostname matches the inventory name
      ansible.builtin.assert:
        that:
          - base_verify_hostname.stdout == inventory_hostname

    - name: Read /etc/hosts
      ansible.builtin.slurp:
        src: /etc/hosts
      register: base_verify_hosts

    - name: Assert /etc/hosts was templated with the local hostname aliases
      ansible.builtin.assert:
        that:
          - >-
            '127.0.1.1 ' ~ inventory_hostname_short ~ ' ' ~ inventory_hostname
            in base_verify_hosts.content | b64decode
          - "'molecule-base.example.invalid' in base_verify_hosts.content | b64decode"

    - name: Query the system timezone
      ansible.builtin.command: timedatectl show --property=Timezone --value
      register: base_verify_timezone
      changed_when: false

    - name: Stat the localtime symlink
      ansible.builtin.stat:
        path: /etc/localtime
      register: base_verify_localtime

    - name: Assert the timezone is Europe/London
      ansible.builtin.assert:
        that:
          - base_verify_timezone.stdout == 'Europe/London'
          - base_verify_localtime.stat.lnk_source.endswith('/Europe/London')

    - name: List generated locales
      ansible.builtin.command: locale -a
      register: base_verify_locales
      changed_when: false

    - name: Read the default locale file
      ansible.builtin.slurp:
        src: /etc/default/locale
      register: base_verify_default_locale

    - name: Assert the en_GB locale was generated and set as default
      ansible.builtin.assert:
        that:
          - "'en_GB.utf8' in base_verify_locales.stdout_lines"
          - >-
            'LANG="en_GB.UTF-8"' in base_verify_default_locale.content | b64decode

    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Assert default and extra system packages are installed
      ansible.builtin.assert:
        that:
          - "'htop' in ansible_facts.packages"
          - "'zstd' in ansible_facts.packages"
          - "'openssh-server' in ansible_facts.packages"
          - "'unattended-upgrades' in ansible_facts.packages"
          - "'needrestart' in ansible_facts.packages"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert sshd is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.service'].state == 'running'

    - name: Assert cron was installed and restarted (bookworm)
      ansible.builtin.assert:
        that:
          - "'cron' in ansible_facts.packages"
          - ansible_facts.services['cron.service'].state == 'running'
      when: ansible_facts['distribution_release'] == 'bookworm'

    - name: Assert the cron restart was skipped on a cron-less image (trixie)
      ansible.builtin.assert:
        that:
          - "'cron' not in ansible_facts.packages"
      when: ansible_facts['distribution_release'] == 'trixie'

    - name: Read the passwd database
      ansible.builtin.getent:
        database: passwd

    - name: Read the group database
      ansible.builtin.getent:
        database: group

    - name: Assert managed users exist with a bash shell and group memberships
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd['molecule-admin'][5] == '/bin/bash'
          - ansible_facts.getent_passwd['molecule-deploy'][5] == '/bin/bash'
          - "'molecule-admin' in ansible_facts.getent_group['ssh-users'][2].split(',')"
          - "'molecule-deploy' in ansible_facts.getent_group['ssh-users'][2].split(',')"
          - "'molecule-admin' in ansible_facts.getent_group['sudo'][2].split(',')"
          - "'molecule-deploy' in ansible_facts.getent_group['sftp-users'][2].split(',')"

    - name: Stat the admin authorized_keys file
      ansible.builtin.stat:
        path: /home/molecule-admin/.ssh/authorized_keys
      register: base_verify_admin_keys_stat

    - name: Read the admin authorized_keys file
      ansible.builtin.slurp:
        src: /home/molecule-admin/.ssh/authorized_keys
      register: base_verify_admin_keys

    - name: Assert the admin key is authorized with safe ownership and mode
      ansible.builtin.assert:
        that:
          - >-
            lookup('file', base_molecule_admin_key_file)
            in base_verify_admin_keys.content | b64decode
          - base_verify_admin_keys_stat.stat.pw_name == 'molecule-admin'
          - base_verify_admin_keys_stat.stat.mode == '0600'

    - name: Read the deploy authorized_keys file
      ansible.builtin.slurp:
        src: /home/molecule-deploy/.ssh/authorized_keys
      register: base_verify_deploy_keys

    - name: Assert the deploy key is authorized and the stray key was removed
      ansible.builtin.assert:
        that:
          - >-
            lookup('file', base_molecule_deploy_key_file)
            in base_verify_deploy_keys.content | b64decode
          - >-
            base_molecule_stray_public_key
            not in base_verify_deploy_keys.content | b64decode

    - name: Validate the full sshd configuration
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Dump the effective sshd configuration
      ansible.builtin.command: sshd -T
      register: base_verify_sshd_config
      changed_when: false

    # sshd -T prints prohibit-password under its legacy name.
    - name: Assert converge values are live in the effective sshd config
      vars:
        base_verify_permit_root: "{{ 'without-password' if ansible_facts['distribution_release'] == 'bookworm' else 'no' }}"
      ansible.builtin.assert:
        that:
          - "'allowtcpforwarding yes' in base_verify_sshd_config.stdout_lines"
          - "'allowgroups ssh-users' in base_verify_sshd_config.stdout_lines"
          - "'allowgroups sftp-users' in base_verify_sshd_config.stdout_lines"
          - "'allowgroups root' in base_verify_sshd_config.stdout_lines"
          - "'x11forwarding no' in base_verify_sshd_config.stdout_lines"
          - "'permitrootlogin ' ~ base_verify_permit_root in base_verify_sshd_config.stdout_lines"

    - name: Stat root's authorized keys
      ansible.builtin.stat:
        path: /root/.ssh/authorized_keys
      register: base_verify_root_keys

    - name: Assert root's injected keys were removed only where root login is disabled
      ansible.builtin.assert:
        that:
          - base_verify_root_keys.stat.exists == (ansible_facts['distribution_release'] == 'bookworm')

    - name: Generate a throwaway SSH client key
      ansible.builtin.command: ssh-keygen -q -t ed25519 -N '' -C molecule-probe -f /var/tmp/molecule-ssh-probe
      args:
        creates: /var/tmp/molecule-ssh-probe

    - name: Read the throwaway public key
      ansible.builtin.slurp:
        src: /var/tmp/molecule-ssh-probe.pub
      register: base_verify_probe_pubkey

    - name: Authorize the throwaway key for the admin user and root
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ base_verify_probe_pubkey.content | b64decode }}"
      loop:
        - molecule-admin
        - root

    - name: Log in over SSH as the admin user
      ansible.builtin.command: >-
        ssh -i /var/tmp/molecule-ssh-probe -o BatchMode=yes -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
        molecule-admin@127.0.0.1 id -un
      register: base_verify_ssh_admin
      changed_when: false

    - name: Attempt to log in over SSH as root
      ansible.builtin.command: >-
        ssh -i /var/tmp/molecule-ssh-probe -o BatchMode=yes -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
        root@127.0.0.1 id -un
      register: base_verify_ssh_root
      changed_when: false
      failed_when: false

    - name: Assert the admin can log in and root login follows the configured value
      vars:
        base_verify_root_allowed: "{{ ansible_facts['distribution_release'] == 'bookworm' }}"
      ansible.builtin.assert:
        that:
          - base_verify_ssh_admin.stdout == 'molecule-admin'
          - >-
            (base_verify_ssh_root.rc == 0 and base_verify_ssh_root.stdout == 'root')
            if base_verify_root_allowed else
            (base_verify_ssh_root.rc == 255 and 'Permission denied' in base_verify_ssh_root.stderr)

    - name: Stat the sshd drop-in
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/99-custom.conf
      register: base_verify_sshd_dropin

    - name: Read the sshd drop-in
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config.d/99-custom.conf
      register: base_verify_sshd_dropin_content

    - name: Assert the sshd drop-in content, ownership and mode
      ansible.builtin.assert:
        that:
          - base_verify_sshd_dropin.stat.pw_name == 'root'
          - base_verify_sshd_dropin.stat.mode == '0644'
          - "'DebianBanner no' in base_verify_sshd_dropin_content.content | b64decode"

    - name: Read the system known hosts file
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_known_hosts
      register: base_verify_known_hosts

    - name: Assert the known host entry is present
      ansible.builtin.assert:
        that:
          - base_molecule_known_host_entry in base_verify_known_hosts.content | b64decode

    - name: Read the profile.d drop-in
      ansible.builtin.slurp:
        src: /etc/profile.d/molecule-profile.sh
      register: base_verify_profile

    - name: Assert the profile drop-in was templated
      ansible.builtin.assert:
        that:
          - "'export MOLECULE_BASE_PROFILE=' in base_verify_profile.content | b64decode"
          - base_molecule_profile_marker in base_verify_profile.content | b64decode

    - name: Check the skel prompt uses the full-hostname escape
      ansible.builtin.command: grep -F -c '\u@\H' /etc/skel/.bashrc
      register: base_verify_skel_prompt
      changed_when: false

    - name: Check the short-hostname escape is gone from the skel prompt
      ansible.builtin.command: grep -F -c '\u@\h' /etc/skel/.bashrc
      register: base_verify_skel_prompt_short
      changed_when: false
      failed_when: base_verify_skel_prompt_short.rc != 1

    - name: Verify bookworm-only networking and backports configuration
      when: ansible_facts['distribution_release'] == 'bookworm'
      block:
        - name: Read dhclient.conf
          ansible.builtin.slurp:
            src: /etc/dhcp/dhclient.conf
          register: base_verify_dhclient

        - name: Assert the DNS servers are prepended in dhclient.conf
          ansible.builtin.assert:
            that:
              - >-
                'prepend domain-name-servers 9.9.9.9 149.112.112.112;'
                in base_verify_dhclient.content | b64decode

        - name: Stat the backports repo definition
          ansible.builtin.stat:
            path: /etc/apt/sources.list.d/debian-backports.sources
          register: base_verify_backports

        - name: Assert the backports repo is configured
          ansible.builtin.assert:
            that:
              - base_verify_backports.stat.exists

    - name: Verify trixie skips dhclient and backports
      when: ansible_facts['distribution_release'] == 'trixie'
      block:
        - name: Stat dhclient.conf
          ansible.builtin.stat:
            path: /etc/dhcp/dhclient.conf
          register: base_verify_dhclient_absent

        - name: Stat the backports repo definition
          ansible.builtin.stat:
            path: /etc/apt/sources.list.d/debian-backports.sources
          register: base_verify_backports_absent

        - name: Assert dhclient.conf and backports are absent
          ansible.builtin.assert:
            that:
              - not base_verify_dhclient_absent.stat.exists
              - not base_verify_backports_absent.stat.exists

    - name: Dump the effective apt configuration
      ansible.builtin.command: apt-config dump
      register: base_verify_apt_config
      changed_when: false

    - name: Assert the unattended-upgrades policy is live in apt's config
      vars:
        base_verify_reboot: "{{ 'false' if ansible_facts['distribution_release'] == 'bookworm' else 'true' }}"
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Update-Package-Lists \"always\";' in base_verify_apt_config.stdout_lines"
          - "'APT::Periodic::Unattended-Upgrade \"always\";' in base_verify_apt_config.stdout_lines"
          - >-
            'Unattended-Upgrade::Automatic-Reboot "' ~ base_verify_reboot ~ '";'
            in base_verify_apt_config.stdout_lines
          - >-
            base_verify_apt_config.stdout_lines
            | select('match', 'Unattended-Upgrade::Origins-Pattern:: ') | list
            == ['Unattended-Upgrade::Origins-Pattern:: "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";']

    - name: Dry-run unattended-upgrade
      ansible.builtin.command: unattended-upgrade --dry-run --debug
      register: base_verify_uu_dry_run
      changed_when: false

    - name: Assert unattended-upgrade allows only the release's security origin
      vars:
        base_verify_uu_output: "{{ base_verify_uu_dry_run.stdout ~ base_verify_uu_dry_run.stderr }}"
      ansible.builtin.assert:
        that:
          - >-
            'origin=Debian,codename=' ~ ansible_facts['distribution_release']
            ~ '-security,label=Debian-Security' in base_verify_uu_output
          - >-
            'codename=' ~ ansible_facts['distribution_release'] ~ ',label=Debian'
            not in base_verify_uu_output

    - name: Query the apt-daily-upgrade timer # noqa: command-instead-of-module (reads unit properties for assertions)
      ansible.builtin.command: >-
        systemctl show apt-daily-upgrade.timer
        --property=TimersCalendar --property=RandomizedDelayUSec
        --property=UnitFileState --property=ActiveState
      register: base_verify_upgrade_timer
      changed_when: false

    - name: Assert the timer fires daily at the configured time
      ansible.builtin.assert:
        that:
          - "'OnCalendar=*-*-* 03:17:00' in base_verify_upgrade_timer.stdout"
          - "'06:00' not in base_verify_upgrade_timer.stdout"
          - "'RandomizedDelayUSec=0' in base_verify_upgrade_timer.stdout_lines"
          - "'UnitFileState=enabled' in base_verify_upgrade_timer.stdout_lines"
          - "'ActiveState=active' in base_verify_upgrade_timer.stdout_lines"

    - name: Query the apt-daily-upgrade service pre-start commands # noqa: command-instead-of-module (reads unit properties for assertions)
      ansible.builtin.command: systemctl show apt-daily-upgrade.service --property=ExecStartPre
      register: base_verify_upgrade_service
      changed_when: false

    - name: Assert package lists are refreshed before upgrading
      ansible.builtin.assert:
        that:
          - "'argv[]=/usr/lib/apt/apt.systemd.daily update' in base_verify_upgrade_service.stdout"

    # needrestart end-to-end, last because it mutates the container: run a
    # daemon, swap its binary underneath it, then let a non-interactive apt
    # run (the unattended-upgrades path) trigger needrestart's hook.
    - name: Install a stand-in daemon binary
      ansible.builtin.copy:
        src: /usr/bin/sleep
        dest: /usr/local/sbin/molecule-stale
        remote_src: true
        mode: "0755"

    - name: Install the stand-in daemon unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/molecule-stale.service
        content: |
          [Service]
          ExecStart=/usr/local/sbin/molecule-stale infinity
        mode: "0644"

    - name: Start the stand-in daemon
      ansible.builtin.systemd_service:
        name: molecule-stale.service
        state: started
        daemon_reload: true

    - name: Record the stand-in daemon's PID # noqa: command-instead-of-module (reads unit properties for assertions)
      ansible.builtin.command: systemctl show molecule-stale.service --property=MainPID --value
      register: base_verify_stale_pid_before
      changed_when: false

    - name: Replace the binary under the running daemon
      ansible.builtin.command: cp --remove-destination /usr/bin/sleep /usr/local/sbin/molecule-stale
      changed_when: true

    - name: List services needrestart considers outdated
      ansible.builtin.command: needrestart -b
      register: base_verify_needrestart_before
      changed_when: false

    - name: Assert needrestart detects the outdated daemon
      ansible.builtin.assert:
        that:
          - "'NEEDRESTART-SVC: molecule-stale.service' in base_verify_needrestart_before.stdout_lines"

    # The .deb is still cached from converge, so this needs no network.
    - name: Reinstall a package to fire the needrestart apt hook # noqa: command-instead-of-module (the apt module cannot reinstall)
      ansible.builtin.command: apt-get install -y --reinstall nano
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

    - name: Record the stand-in daemon's PID after the hook # noqa: command-instead-of-module (reads unit properties for assertions)
      ansible.builtin.command: systemctl show molecule-stale.service --property=MainPID --value
      register: base_verify_stale_pid_after
      changed_when: false

    - name: List services needrestart considers outdated after the hook
      ansible.builtin.command: needrestart -b
      register: base_verify_needrestart_after
      changed_when: false

    - name: Assert the apt hook restarted the daemon automatically
      ansible.builtin.assert:
        that:
          - base_verify_stale_pid_after.stdout | int > 0
          - base_verify_stale_pid_after.stdout != base_verify_stale_pid_before.stdout
          - "'NEEDRESTART-SVC: molecule-stale.service' not in base_verify_needrestart_after.stdout_lines"
