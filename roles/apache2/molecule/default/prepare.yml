---
# The converge vhost serves static files; providing web content is outside
# the role's contract, so create the docroot fixture here.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Create docroot directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /var/www/molecule
        - /var/www/molecule/secure

    - name: Write index pages
      ansible.builtin.copy:
        content: "{{ item.content }}\n"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - dest: /var/www/molecule/index.html
          content: molecule vhost ok
        - dest: /var/www/molecule/secure/index.html
          content: molecule secure ok
      loop_control:
        label: "{{ item.dest }}"

    # An earlier run that also managed the info module and stale.conf, which have
    # since left the role's lists, plus a vhost enabled by hand that must be kept.
    - name: Install apache2
      ansible.builtin.apt:
        pkg: apache2
        update_cache: true

    - name: Enable the info module
      community.general.apache2_module:
        name: info
        state: present

    - name: Write the stale and hand-made vhosts
      ansible.builtin.copy:
        content: "<VirtualHost *:80>\n    ServerName {{ item }}.test\n</VirtualHost>\n"
        dest: "/etc/apache2/sites-available/{{ item }}.conf"
        mode: "0644"
      loop: [stale, other]

    - name: Enable the stale and hand-made vhosts
      ansible.builtin.file:
        src: "/etc/apache2/sites-available/{{ item }}.conf"
        path: "/etc/apache2/sites-enabled/{{ item }}.conf"
        state: link
      loop: [stale, other]

    - name: Record the earlier run's modules and vhosts
      ansible.builtin.copy:
        content: >-
          {"modules": ["proxy_fcgi", "setenvif", "rewrite", "headers", "ssl", "info"],
          "vhosts": ["molecule.conf", "stale.conf"]}
        dest: /var/lib/apache2/ansible-managed.json
        mode: "0644"
