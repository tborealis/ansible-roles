---
apache2_user: www-data

apache2_vhosts: []
apache2_basic_auth: []
apache2_packages:
  - apache2
  - apache2-utils
  - python3-passlib

apache2_modules:
  - proxy_fcgi
  - setenvif
  - rewrite
  - headers
  - ssl

apache2_disable_modules:
  - mpm_prefork

apache2_env_vars: {}

# The Server header and error-page footer; Debian's security.conf sends the exact
# version and OS ("OS" and "On"), which scanners use to find vulnerable hosts.
apache2_server_tokens: Prod
apache2_server_signature: "Off"
