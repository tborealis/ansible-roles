---
# YAML has already turned an unquoted 8.10 into 8.1, so floats are rejected
# rather than coerced.
- name: Assert redis_version is a major or quoted major.minor
  ansible.builtin.assert:
    that:
      - redis_version is not float
      - redis_version | string is match('^([0-9]+(\.[0-9]+)?)?$')
    fail_msg: >-
      redis_version must be empty, a major (8) or a quoted major.minor ("8.10");
      unquoted, YAML reads 8.10 as the number 8.1.

- name: Install deb822 dependency
  ansible.builtin.apt:
    pkg: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Redis repository
  ansible.builtin.deb822_repository:
    name: redis
    types: [deb]
    uris: https://packages.redis.io/deb
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /etc/apt/keyrings/redis-archive-keyring.gpg
  register: redis_repo

- name: Update apt cache after adding repository # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: redis_repo is changed

- name: Pin Redis version
  ansible.builtin.template:
    src: redis.pref.j2
    dest: /etc/apt/preferences.d/redis.pref
    owner: root
    group: root
    mode: "0644"
  when: redis_version | string | length > 0

- name: Remove Redis version pin
  ansible.builtin.file:
    path: /etc/apt/preferences.d/redis.pref
    state: absent
  when: redis_version | string | length == 0

- name: Install Redis
  ansible.builtin.apt:
    pkg: redis-server
    state: present
    update_cache: true
    cache_valid_time: 3600

# Must run before the managed config gains its include of redis.conf, or the
# two files would include each other.
- name: Remove legacy include from the packaged Redis config
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    line: include /etc/redis/redis-ansible.conf
    state: absent
  notify: Restart redis

- name: Configure Redis
  ansible.builtin.template:
    src: redis-ansible.conf.j2
    dest: /etc/redis/redis-ansible.conf
    owner: root
    group: redis
    mode: "0640"
  notify: Restart redis

- name: Create redis-server systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/redis-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure redis-server to load the managed config
  ansible.builtin.template:
    src: redis-server.service.conf.j2
    dest: /etc/systemd/system/redis-server.service.d/ansible.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart redis

- name: Enable and start Redis
  ansible.builtin.systemd:
    name: redis-server
    enabled: true
    state: started

- name: Add vm.overcommit_memory = 1 to sysctl
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: 1
    reload: true
  when: redis_overcommit_memory
