---
# The role installs git from backports on bookworm and assumes the backports
# source is already configured (the base role does this on real hosts).
- name: Prepare
  hosts: all
  become: true
  vars_files:
    - ../../vars/main.yml
  tasks:
    - name: Trust GitHub's exposed RSA host key, as role versions before August 2023 did
      ansible.builtin.lineinfile:
        path: /etc/ssh/ssh_known_hosts
        line: "github.com {{ git_github_exposed_rsa_key }}"
        create: true
        mode: "0644"

    - name: Configure backports repo
      when: ansible_facts['distribution_release'] == 'bookworm'
      block:
        - name: Install deb822 dependency
          ansible.builtin.apt:
            pkg: python3-debian
            state: present
            update_cache: true

        - name: Add backports repo
          ansible.builtin.deb822_repository:
            name: debian-backports
            types: [deb]
            uris: https://deb.debian.org/debian
            suites: "{{ ansible_facts['distribution_release'] }}-backports"
            components: main
            state: present

        - name: Update apt cache after adding repository
          ansible.builtin.apt:
            update_cache: true
