---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    pkg: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: nginx_unattended_upgrades

- name: Allow unattended-upgrades to install updates from the Nginx repository
  ansible.builtin.template:
    src: unattended-upgrades-nginx.j2
    dest: /etc/apt/apt.conf.d/53unattended-upgrades-nginx
    owner: root
    group: root
    mode: "0644"
  when: nginx_unattended_upgrades

- name: Remove the Nginx repository from unattended-upgrades
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/53unattended-upgrades-nginx
    state: absent
  when: not nginx_unattended_upgrades
