---
# Throwaway test credentials shared by converge.yml and verify.yml. Deliberately
# NOT shaped like real DigitalOcean/Cloudflare tokens so secret scanning cannot
# mistake them for one; no ACME requests are made because certbot_certs is
# empty or already issued.
certbot_digitalocean_dns_token: molecule-fake-do-token-0123456789
certbot_cloudflare_dns_token: molecule-fake-cloudflare-token-0123456789

# Apache-mode fixture shared by converge.yml, verify.yml and the vhost
# template under templates/apache2/vhosts/.
certbot_test_vhost_server_name: molecule-ssl.test
certbot_test_vhost_marker: certbot-molecule-vhost-ok

# Certificates prepare.yml seeds as already issued (a placeholder cert.pem, so
# the role skips issuance) for the dns-cloudflare play's propagation step. The
# one on dns-cloudflare is bookworm-only: applying the value there runs
# certbot reconfigure on trixie, which needs Let's Encrypt.
certbot_test_certs:
  - name: digitalocean.test
    plugin: digitalocean
    admin_email: admin@digitalocean.test
    domains:
      - digitalocean.test
  - name: cloudflare.test
    plugin: cloudflare
    admin_email: admin@cloudflare.test
    domains:
      - cloudflare.test
certbot_test_seeded_certs: >-
  {{ certbot_test_certs if ansible_facts['distribution_major_version'] | int < 13
     else certbot_test_certs[:1] }}
