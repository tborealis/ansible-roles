---
# Chrome for Testing version lists and downloads (the sources @puppeteer/browsers
# used, with the same /opt/<browser>/linux-<version> layout).
chrome_versions_url: https://googlechromelabs.github.io/chrome-for-testing
chrome_download_url: https://storage.googleapis.com/chrome-for-testing-public

# Channels resolved through the version lists; a bare number is a milestone and
# anything else an exact version.
chrome_release_channels: [stable, beta, dev, canary]

# Dependencies renamed by the 64-bit time_t transition in Debian 13 "trixie".
chrome_release_dependencies:
  bookworm:
    - libasound2
    - libatk-bridge2.0-0
    - libatk1.0-0
    - libatspi2.0-0
    - libcups2
    - libglib2.0-0
  trixie:
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libatspi2.0-0t64
    - libcups2t64
    - libglib2.0-0t64
