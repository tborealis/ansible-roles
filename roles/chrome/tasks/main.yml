---
- name: Assert the architecture is supported
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'x86_64'
    fail_msg: The chrome role installs the x86_64 (linux64) build only.

- name: Remove system chrome
  ansible.builtin.include_tasks: remove-system-chrome.yml
  when: chrome_remove_system_chrome

- name: Install chrome system dependencies
  ansible.builtin.apt:
    pkg: "{{ chrome_system_dependencies + chrome_release_dependencies[ansible_facts['distribution_release']] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check current chrome version
  ansible.builtin.command: /usr/local/bin/google-chrome --version
  register: chrome_current_version
  changed_when: false
  failed_when: false

- name: Resolve the chrome channel or milestone version
  ansible.builtin.uri:
    url: "{{ chrome_versions_url }}/{{ chrome_versions_list }}.json"
    return_content: true
  vars:
    chrome_versions_list: >-
      {{ 'last-known-good-versions' if chrome_version | string in chrome_release_channels
         else 'latest-versions-per-milestone' }}
  register: chrome_channel_versions
  when: chrome_version | string in chrome_release_channels or chrome_version | string is match('[0-9]+$')

- name: Set the chrome target version
  ansible.builtin.set_fact:
    chrome_target_version: >-
      {{ chrome_channel_versions.json.channels[chrome_version | capitalize].version
         if chrome_version | string in chrome_release_channels
         else chrome_channel_versions.json.milestones[chrome_version | string].version
         if chrome_version | string is match('[0-9]+$')
         else chrome_version | string }}

- name: Install chrome
  when: chrome_current_version.rc != 0 or chrome_target_version not in chrome_current_version.stdout
  block:
    - name: Create the chrome install directory
      ansible.builtin.file:
        path: /opt/chrome/linux-{{ chrome_target_version }}
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download and unpack chrome
      ansible.builtin.unarchive:
        src: "{{ chrome_download_url }}/{{ chrome_target_version }}/linux64/chrome-linux64.zip"
        dest: /opt/chrome/linux-{{ chrome_target_version }}
        remote_src: true

- name: Link chrome
  ansible.builtin.file:
    src: /opt/chrome/linux-{{ chrome_target_version }}/chrome-linux64/chrome
    dest: /usr/local/bin/google-chrome
    state: link
    force: true

- name: Chromedriver tasks
  ansible.builtin.import_tasks: chromedriver.yml
  when: chrome_install_chromedriver
